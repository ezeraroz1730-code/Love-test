
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Test Prank 💗</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="hearts"></div>

    <main class="container">
        <div class="emoji" id="emoji">💗</div>

        <h1>LOVE TEST 💘</h1>
        <p class="subtitle">
            Tubaga og tinuod, bestie! HAHAHA 😭
        </p>

        <section id="game">
            <p id="progress">Question 1 of 20</p>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <h2 id="question">Love pa ba ka niya? 🥹</h2>

            <div class="buttons">
                <button id="yesBtn" class="yes">
                    YES ❤️
                </button>

                <button id="noBtn" class="no">
                    NO 💔
                </button>
            </div>

            <p class="hint">
                TRY DAW UG YES HAHAAHAHAH! 😈
            </p>
        </section>

        <section id="resultScreen" class="hidden">
            <h2 id="resultTitle">YOUR RESULT 💌</h2>
            <div class="big-heart">💖🥰💖</div>
            <p id="result"></p>

            <button id="restartBtn" class="restart">
                PLAY AGAIN 🔄
            </button>
        </section>
    </main>

</body>
</html>
